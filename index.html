const frame=document.getElementById("gameFrame"),transition=document.getElementById("transition");
function load1(){frame.srcdoc=decode(L1)}
function load2(data){transition.classList.add("show");setTimeout(()=>{frame.onload=()=>{frame.onload=null;setTimeout(()=>frame.contentWindow.postMessage({type:"INIT_CASE_2",name:data.name,gender:data.gender,stamina:data.stamina},"*"),120)};frame.srcdoc=decode(L2);setTimeout(()=>transition.classList.remove("show"),450)},850)}

load1();
